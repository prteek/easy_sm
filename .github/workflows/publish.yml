name: Publish
on:
  push:
    tags:
      - 'v*'  # Trigger only on version tags (v1.0.0, v1.0.1, etc.)

# Deny everything by default; each job asks only for what it needs
permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel

    - name: Build a binary wheel and a source tarball
      run: |
        python setup.py sdist bdist_wheel

    - name: Store distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment configured in the PyPI trusted publisher.
    # The environment only allows deployments from v* tags.
    environment:
      name: pypi
      url: https://pypi.org/project/easy-sm/
    permissions:
      id-token: write  # Trusted Publishing: short-lived OIDC token instead of a stored API token
    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        skip-existing: true

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > notes.md <<EOF
        ## Version ${GITHUB_REF_NAME}

        Package published to PyPI: https://pypi.org/project/easy-sm/${GITHUB_REF_NAME#v}/

        See commit history: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}
        EOF
        gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
          --title "Release ${GITHUB_REF_NAME}" --notes-file notes.md
