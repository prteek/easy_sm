name: Test
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('base-requirements.txt', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . -r base-requirements.txt

    - name: Run pytest
      run: |
        pytest --cov=easy_sm --cov-report=term-missing

    - name: Run type checking with mypy
      run: |
        mypy easy_sm/

    - name: Run linting with ruff
      run: |
        ruff check easy_sm/
