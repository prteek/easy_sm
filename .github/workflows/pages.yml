name: Pages

# Publishes .github/README.md as the one-page site at https://prteek.github.io/easy_sm/
on:
  push:
    branches: ['main']
    paths:
      - '.github/README.md'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'

# Deny everything by default; each job asks only for what it needs
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render README
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Render the page
        run: |
          pip install markdown==3.9
          python scripts/build_pages.py _site

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
